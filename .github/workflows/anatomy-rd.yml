name: Lab anatomy motion R&D
on:
  push:
    branches: [experiment/motion-temporal-rd]
    paths:
      - 'godot/tests/anatomy_rd.gd'
      - 'godot/lab/anatomy_rd/**'
      - 'tools/anatomy_rd.py'
      - '.github/workflows/anatomy-rd.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lab-godot
          key: lab-godot-linux-4.4.1
      - name: Godot 4.4.1
        run: |
          mkdir -p ~/.cache/lab-godot
          if [ ! -x ~/.cache/lab-godot/godot ]; then
            curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
            unzip -qo /tmp/godot.zip -d ~/.cache/lab-godot
            mv ~/.cache/lab-godot/Godot_v4.4.1-stable_linux.x86_64 ~/.cache/lab-godot/godot
          fi
          echo "$HOME/.cache/lab-godot" >> "$GITHUB_PATH"
      - name: Native capture and rank
        run: |
          python -m pip install numpy pillow
          python tools/anatomy_rd.py --godot godot --xvfb --out anatomy-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-rd
          path: |
            anatomy-results/*.gif
            anatomy-results/stance-review.png
            anatomy-results/stance-skin-review.png
            anatomy-results/*.json
            anatomy-results/engine.log
            godot/tests/anatomy_rd.gd
            godot/lab/anatomy_rd/
            tools/anatomy_rd.py
