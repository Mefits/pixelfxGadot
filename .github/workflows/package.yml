name: Unified toolkit package
on:
  workflow_dispatch:
    inputs:
      cpp_run:
        description: Successful Optional C++ raster run ID
        required: true
        default: '45385382698'
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPP_RUN: ${{ inputs.cpp_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Verify binary provenance
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CPP_RUN" > /tmp/cpp-run.json
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("/tmp/cpp-run.json"));if(x.conclusion!=="success"||x.path!==".github/workflows/cpp.yml"||x.head_branch!=="main")throw Error("Not a successful main C++ run");'
          SHA=$(jq -r .head_sha /tmp/cpp-run.json)
          git diff --exit-code "$SHA" HEAD -- native_cpp/kernel.hpp native_cpp/extension.cpp native_cpp/SConstruct native_cpp/build.py native_cpp/build_profile.json native_cpp/pixelfx.gdextension godot/addons/pixelfx/native/lightning.gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.CPP_RUN }}
          github-token: ${{ github.token }}
          pattern: pixelfx-cpp-*
          path: /tmp/pixelfx-binaries
      - run: npm run bootstrap
      - run: node tools/check_exports.mjs
      - run: node tools/make_native_fixture.mjs
      - run: node tools/package.mjs
      - run: node tools/bundle_accelerators.mjs /tmp/pixelfx-binaries "$CPP_RUN"
      - name: Validate bundled project
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          PROJECT=dist/PixelFX-Godot-Toolkit/godot
          "$GODOT" --headless --path "$PROJECT" --editor --import
          "$GODOT" --headless --path "$PROJECT" --script res://tests/native.gd -- --cpp
          "$GODOT" --headless --path "$PROJECT" --script res://tests/smoke.gd
          "$GODOT" --headless --path "$PROJECT" res://lab/live_lightning.tscn --quit-after 120 -- --demo-native
          rm -rf "$PROJECT/.godot"
          find "$PROJECT" -name '*.import' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: PixelFX-Godot-Toolkit-Complete
          path: dist/PixelFX-Godot-Toolkit/
          if-no-files-found: error
