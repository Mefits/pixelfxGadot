name: N foundation
on:
  push:
    branches: [project/N]
    paths:
      - '.github/workflows/n.yml'
      - 'docs/CHECKPOINT.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.4.1
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import and regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --import 2>&1 | tee /tmp/n-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/n-import.log; then exit 1; fi
          timeout 30s godot --headless --script res://tests/locomotion.gd 2>&1 | tee /tmp/n-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/n-tests.log; then exit 1; fi
          timeout 30s godot --headless --script res://tests/jab.gd 2>&1 | tee /tmp/n-jab.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/n-jab.log; then exit 1; fi
          timeout 30s godot --headless --script res://tests/hybrid.gd 2>&1 | tee /tmp/n-hybrid.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/n-hybrid.log; then exit 1; fi
          timeout 180s xvfb-run -a godot --audio-driver Dummy --resolution 960x540 --script res://tests/visual.gd 2>&1 | tee /tmp/n-visual.log
          if grep -E 'ERROR:|Parse Error|Failed to load script' /tmp/n-visual.log; then exit 1; fi
          test -f reports/stance.png
          test -f reports/running.png
          test -f reports/jump.png
          test "$(find reports/guard -name '*.png' | wc -l)" -eq 24
          test "$(find reports/walk -name '*.png' | wc -l)" -eq 32
          test "$(find reports/run -name '*.png' | wc -l)" -eq 36
          test "$(find reports/back -name '*.png' | wc -l)" -eq 32
          test "$(find reports/leap -name '*.png' | wc -l)" -eq 30
          test "$(find reports/jab -name '*.png' | wc -l)" -eq 34
          for kind in heavy_hybrid heavy_authored jab_hybrid jab_authored heavy_mannequin; do test "$(find reports/$kind -name '*.png' | wc -l)" -eq 44; done
          rm -rf .godot
          find . -name '*.import' -delete
          printf '%s\n' "$GITHUB_SHA" > REVISION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: N-Test-Logs
          path: /tmp/n-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: N-0.06-Godot
          path: |
            project.godot
            game/
            tests/
            docs/
            README.md
            AGENTS.md
            REVISION.txt
            reports/
