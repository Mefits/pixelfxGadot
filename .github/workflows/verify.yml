name: PixelFX verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run bootstrap
      - run: node tools/check_exports.mjs
      - run: node tools/make_fixture.mjs
      - run: node tools/make_native_fixture.mjs
      - run: node tools/make_painter_fixture.mjs
      - run: node tools/make_core_fixture.mjs
      - run: node tools/make_chain_fixture.mjs
      - run: node tools/make_particles_fixture.mjs
      - run: node tools/make_bits_fixture.mjs
      - run: node tools/make_ball_fixture.mjs
      - run: node tools/package.mjs
      - name: Validate portable snapshot and regenerate one clip offline
        run: |
          cd dist/PixelFX-Godot-Toolkit
          npm run setup
          npm test
          node tools/export.mjs lightning/chain-lightning --name portable-check
          rm -rf godot/generated/portable-check
      - uses: actions/upload-artifact@v4
        with:
          name: PixelFX-Godot-Toolkit
          path: dist/PixelFX-Godot-Toolkit/
      - name: Install Godot 4.4.1
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Import project
        run: godot --headless --path godot --editor --import
      - name: Engine smoke tests
        run: godot --headless --path godot --script res://tests/smoke.gd
      - name: Native CPU parity tests
        run: godot --headless --path godot --script res://tests/native.gd
      - name: Full Painter parity
        run: godot --headless --path godot --script res://tests/painter_full.gd
      - name: Native core helpers parity
        run: godot --headless --path godot --script res://tests/core.gd
      - name: Native particles parity
        run: godot --headless --path godot --script res://tests/particles.gd
      - name: Native debris parity
        run: godot --headless --path godot --script res://tests/bits.gd
      - name: Full native Ball Lightning parity
        run: godot --headless --path godot --script res://tests/ball.gd
      - name: Original custom effect replay
        run: godot --headless --path godot --script res://tests/custom.gd
      - name: Custom workshop smoke
        run: godot --headless --path godot res://lab/custom_effects.tscn --quit-after 120
      - name: Full Chain Lightning effect parity
        run: godot --headless --path godot --script res://tests/chain.gd
      - name: Native CPU reference benchmark
        run: godot --headless --path godot --script res://tests/native_benchmark.gd
      - name: Live scene smoke
        run: timeout 30s godot --headless --path godot res://lab/live_lightning.tscn --quit-after 120 -- --demo-native
      - name: Actual GL pixel comparison
        run: timeout 90s xvfb-run -a godot --path godot --rendering-method gl_compatibility --script res://tests/visual.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelfx-verification
          path: |
            reports/
            godot/generated/**/clip.json
            godot/generated/**/reference.png
          if-no-files-found: ignore
