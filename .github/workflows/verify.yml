name: PixelFX verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run bootstrap
      - run: node tools/check_exports.mjs
      - run: node tools/make_fixture.mjs
      - run: node tools/make_native_fixture.mjs
      - name: Install Godot 4.4.1
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Import project
        run: godot --headless --path godot --editor --import
      - name: Engine smoke tests
        run: godot --headless --path godot --script res://tests/smoke.gd
      - name: Native CPU parity tests
        run: godot --headless --path godot --script res://tests/native.gd
      - name: Actual GL pixel comparison
        run: timeout 90s xvfb-run -a godot --path godot --rendering-method gl_compatibility --script res://tests/visual.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelfx-verification
          path: |
            reports/
            godot/generated/**/clip.json
            godot/generated/**/reference.png
          if-no-files-found: ignore
