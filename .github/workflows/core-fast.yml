name: Native core fast check
on:
  push:
    branches: [main]
    paths:
      - 'godot/addons/pixelfx/**'
      - 'godot/tests/core.gd'
      - 'godot/tests/chain.gd'
      - 'godot/tests/sim_helpers.gd'
      - '.github/workflows/core-fast.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/make_core_fixture.mjs && node tools/make_chain_fixture.mjs && node tools/make_sim_helpers_fixture.mjs && node tools/make_painter_fixture.mjs && node tools/make_electrified_fixture.mjs
      - name: Install Godot
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - run: godot --headless --path godot --editor --import
      - run: timeout 30s godot --headless --path godot --script res://tests/core.gd
      - if: always()
        run: timeout 30s godot --headless --path godot --script res://tests/chain.gd
      - if: always()
        run: timeout 30s godot --headless --path godot --script res://tests/sim_helpers.gd
      - if: always()
        run: timeout 30s godot --headless --path godot --script res://tests/painter_full.gd

      - if: always()
        run: timeout 30s godot --headless --path godot --script res://tests/electrified.gd
