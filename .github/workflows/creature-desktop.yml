name: Creature Windows Desktop 0.26
on:
  push:
    branches: [feature/creature-vfx-integration]
    paths: ['.github/workflows/creature-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Animation-Creature-Lab-Complete
          run-id: 45459950492
          github-token: ${{ github.token }}
          path: /tmp/verified
      - name: Verify source and install Godot export templates
        run: |
          set -euxo pipefail
          test "$(cat /tmp/verified/CREATURE_REVISION.txt)" = a0d227c2ac283e83681220761cf3784d00c5f7a6
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fsSL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Import and export verified project
        shell: bash
        run: |
          set -euxo pipefail
          cp desktop/export_presets.cfg /tmp/verified/godot/
          cp desktop/export_smoke.gd desktop/export_smoke.tscn /tmp/verified/godot/
          mkdir -p /tmp/windows /tmp/linux
          cd /tmp/verified/godot
          godot --headless --editor --import 2>&1 | tee /tmp/desktop-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/desktop-import.log
          godot --headless --export-release "Windows Desktop" /tmp/windows/Creature_PixelFX.exe 2>&1 | tee /tmp/desktop-windows.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Export failed|Failed to export' /tmp/desktop-windows.log
          godot --headless --export-debug "Linux" /tmp/linux/Creature_PixelFX.x86_64 2>&1 | tee /tmp/desktop-linux.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Export failed|Failed to export' /tmp/desktop-linux.log
          test -s /tmp/windows/Creature_PixelFX.exe
          find /tmp/windows -name 'pixelfx.windows.x86_64.dll' -size +0c | grep .
          file /tmp/windows/Creature_PixelFX.exe | grep 'PE32+'
          chmod +x /tmp/linux/Creature_PixelFX.x86_64
          cd /tmp/linux
          timeout 45s ./Creature_PixelFX.x86_64 --headless res://export_smoke.tscn 2>&1 | tee /tmp/desktop-smoke.log
          grep EXPORTED_PACKAGE_SMOKE_OK /tmp/desktop-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/desktop-smoke.log
          timeout 30s ./Creature_PixelFX.x86_64 --headless --quit-after 120 2>&1 | tee /tmp/desktop-launch.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/desktop-launch.log
      - name: Package portable Windows application
        run: |
          cp desktop/README_RU.txt /tmp/windows/
          cp /tmp/verified/LICENSE-*.txt /tmp/windows/
          cp /tmp/verified/CREATURE_REVISION.txt /tmp/windows/
          curl -fsSL --retry 2 https://raw.githubusercontent.com/godotengine/godot/4.4.1-stable/LICENSE.txt -o /tmp/windows/LICENSE-Godot.txt
          curl -fsSL --retry 2 https://raw.githubusercontent.com/godotengine/godot/4.4.1-stable/COPYRIGHT.txt -o /tmp/windows/COPYRIGHT-Godot.txt
          find /tmp/windows -type f -printf '%P %s bytes\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Creature-Desktop-Export-Logs
          path: /tmp/desktop-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: Creature-PixelFX-0.26-Windows-x64
          path: /tmp/windows/
          if-no-files-found: error
