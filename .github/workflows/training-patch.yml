name: Training lightweight patch verification
on:
  push:
    branches: [audit/training-patch]
permissions:
  contents: read
  actions: read
jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lab-Walk-Control-Windows-portable
          path: native
          run-id: 46001744668
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cumulative source update and overlay
        shell: python
        run: |
          from pathlib import Path
          import shutil,zipfile
          paths=["godot/lab/authoring/asset.gd","godot/lab/authoring/editor.gd","godot/lab/main.gd","godot/lab/training_control.gd","godot/lab/training_punch.gd","godot/lab/walk_motion.gd","godot/lab/walk_preview.gd","godot/lab/walk_studio.gd","godot/tests/lab_integration_100.gd","godot/tests/training_control.gd","godot/tests/walk_control.gd"]
          with zipfile.ZipFile("Lab-jab-series-update.zip","w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in paths:
                  z.write(f,f)
                  dst=Path("native")/f
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(f,dst)
              z.writestr("README-TRAINING.txt","Close Godot. Extract into the folder containing godot/project.godot. Reopen project. T: A/D movement, 1 repeated up to three times for jab combo. M: edit the source-based jab series and idle. Saved user motions preserved.")
          print("PATCH_BYTES",Path("Lab-jab-series-update.zip").stat().st_size)
      - name: Verify actual patched Windows project
        shell: pwsh
        run: |
          Set-Location native
          cmd.exe /d /c START_LAB.bat --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($test in @("training_control","walk_control","lab_integration_100")) {
            & .\Godot_console.exe --headless --path godot --audio-driver Dummy --script "res://tests/$test.gd"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Lab-jab-series-small-update
          path: Lab-jab-series-update.zip
