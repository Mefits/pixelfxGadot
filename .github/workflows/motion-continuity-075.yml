name: Lab motion continuity 075
on:
  push:
    branches: [experiment/motion-continuity-075]
    paths:
      - 'godot/lab/pose_transition_075.gd'
      - 'godot/tests/motion_continuity_075.gd'
      - 'tools/motion_continuity_075.py'
      - '.github/workflows/motion-continuity-075.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lab-godot
          key: lab-godot-linux-4.4.1
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: pip install scons numpy scipy pillow
      - name: Native oracle regression
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Build native body extension
        run: python native_cpp/build.py
      - name: Godot
        run: |
          mkdir -p ~/.cache/lab-godot
          if [ ! -x ~/.cache/lab-godot/godot ]; then
            curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
            unzip -qo /tmp/godot.zip -d ~/.cache/lab-godot
            mv ~/.cache/lab-godot/Godot_v4.4.1-stable_linux.x86_64 ~/.cache/lab-godot/godot
          fi
          echo "$HOME/.cache/lab-godot" >> "$GITHUB_PATH"
      - name: Verify frozen poses
        run: ~/.cache/lab-godot/godot --headless --path godot --script res://tests/body_fixture_verify.gd
      - name: Lab 075 capture
        run: |
          mkdir -p godot/.godot
          echo res://addons/pixelfx/pixelfx.gdextension > godot/.godot/extension_list.cfg
          mkdir -p motion-continuity-results
          for script in lab/pose_transition_075.gd tests/motion_continuity_075.gd; do
            godot --headless --path godot --check-only --script "res://$script" 2>&1 | tee -a motion-continuity-results/syntax.log
          done
          ! grep -E 'SCRIPT ERROR|Failed to load script' motion-continuity-results/syntax.log
          python tools/motion_continuity_075.py --godot godot --out motion-continuity-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-continuity-075
          path: |
            motion-continuity-results/*.gif
            motion-continuity-results/metrics.json
            motion-continuity-results/review.png
            motion-continuity-results/syntax.log
            motion-continuity-results/engine.log
            motion-continuity-results/records.json
