name: Lab MotionPhysics qualification 099b
on:
  push:
    branches: [experiment/motionphysics-099b]
    paths:
      - 'native_cpp/motionphysics_099b.cpp'
      - 'native_cpp/MotionPhysics.scons'
      - 'godot/addons/motionphysics/**'
      - 'godot/tests/motionphysics_*_099b.gd'
      - 'tools/motionphysics_099b.py'
      - '.github/workflows/motionphysics-099b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lab-godot
          key: lab-godot-linux-4.4.1
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: pip install scons numpy scipy pillow
      - name: Native oracle regression
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Build native body extension
        run: python native_cpp/build.py
      - name: Godot
        run: |
          mkdir -p ~/.cache/lab-godot
          if [ ! -x ~/.cache/lab-godot/godot ]; then
            curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
            unzip -qo /tmp/godot.zip -d ~/.cache/lab-godot
            mv ~/.cache/lab-godot/Godot_v4.4.1-stable_linux.x86_64 ~/.cache/lab-godot/godot
          fi
          echo "$HOME/.cache/lab-godot" >> "$GITHUB_PATH"
      - name: Verify frozen poses
        run: ~/.cache/lab-godot/godot --headless --path godot --script res://tests/body_fixture_verify.gd
      - name: Build Box2D 3.2.0 and separate MotionPhysics GDExtension
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/erincatto/box2d.git /tmp/box2d
          mkdir -p motionphysics-099b-results
          git -C /tmp/box2d rev-parse HEAD | tee motionphysics-099b-results/box2d_revision.txt
          cp /tmp/box2d/LICENSE motionphysics-099b-results/BOX2D_LICENSE.txt
          cmake -S /tmp/box2d -B /tmp/box2d/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_BENCHMARKS=OFF
          cmake --build /tmp/box2d/build -j 2
          LIB=$(find /tmp/box2d/build -name libbox2d.a -print -quit)
          test -n "$LIB"
          mkdir -p godot/addons/motionphysics/bin
          cd native_cpp
          MOTION_BOX2D_INCLUDE=/tmp/box2d/include MOTION_BOX2D_LIB="$LIB" scons -f MotionPhysics.scons platform=linux arch=x86_64 target=template_release build_profile="$PWD/build_profile.json" -j4
      - name: Qualify native extension and render
        run: |
          mkdir -p godot/.godot
          printf 'res://addons/pixelfx/pixelfx.gdextension\nres://addons/motionphysics/motionphysics.gdextension\n' > godot/.godot/extension_list.cfg
          for script in tests/motionphysics_099b.gd tests/motionphysics_render_099b.gd; do
            godot --headless --path godot --check-only --script "res://$script" 2>&1 | tee -a motionphysics-099b-results/syntax.log
          done
          ! grep -E 'SCRIPT ERROR|Failed to load script' motionphysics-099b-results/syntax.log
          python tools/motionphysics_099b.py --godot godot --out motionphysics-099b-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motionphysics-099b
          path: |
            motionphysics-099b-results/*.gif
            motionphysics-099b-results/*.json
            motionphysics-099b-results/*.log
            motionphysics-099b-results/*.txt
            motionphysics-099b-results/review.png
            motionphysics-099b-results/repeat/qualification.json
            motionphysics-099b-results/repeat/test.log
