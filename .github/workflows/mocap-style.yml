name: Lab mocap style R&D
on:
  push:
    branches: [experiment/motion-temporal-rd]
    paths:
      - 'godot/tests/mocap_style.gd'
      - 'tools/mocap_style.py'
      - '.github/workflows/mocap-style.yml'
      - 'godot/lab/pose_workshop.gd'
      - 'godot/lab/creature_preview.gd'
      - 'godot/tests/lab_combo_editor.gd'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lab-godot
          key: lab-godot-linux-4.4.1
      - name: Godot 4.4.1
        run: |
          mkdir -p ~/.cache/lab-godot
          if [ ! -x ~/.cache/lab-godot/godot ]; then
            curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
            unzip -qo /tmp/godot.zip -d ~/.cache/lab-godot
            mv ~/.cache/lab-godot/Godot_v4.4.1-stable_linux.x86_64 ~/.cache/lab-godot/godot
          fi
          echo "$HOME/.cache/lab-godot" >> "$GITHUB_PATH"
      - name: Native capture and rank
        run: |
          python -m pip install numpy pillow
          python tools/mocap_style.py --godot godot --xvfb --out mocap-style-results
      - name: Editable Lab source and JSON roundtrip
        run: |
          mkdir -p editor-package
          cp -r godot editor-package/
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('mocap-style-results/clip_2.json').read_text())
          e.update(id='lab048_combo_c',name='Lab 0.48 C — комбо с грушей')
          Path('editor-package/Lab048_Combo_C.json').write_text(json.dumps(e,ensure_ascii=False,indent=2),encoding='utf8')
          PY
          xvfb-run -a -s "-screen 0 1280x768x24" godot --path godot --audio-driver Dummy --script res://tests/lab_combo_editor.gd -- "$PWD/editor-package/Lab048_Combo_C.json" "$PWD/mocap-style-results/edited-smoke.json" 2>&1 | tee mocap-style-results/editor.log
          grep LAB_EDITOR_ROUNDTRIP_OK mocap-style-results/editor.log
          ! grep -E 'SCRIPT ERROR|Parse Error' mocap-style-results/editor.log
          printf '%s\n' 'Godot 4.4.1: import godot/project.godot, F6 main.tscn or F5. In launcher Import JSON: Lab048_Combo_C.json. Open in editor; Export JSON to share edits.' > editor-package/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Lab-048-Editable-Godot
          path: editor-package/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mocap-style
          path: |
            mocap-style-results/*.gif
            mocap-style-results/*.json
            mocap-style-results/review.png
            mocap-style-results/engine.log
            mocap-style-results/editor.log
            mocap-style-results/editor-review.png
            mocap-style-results/source.bvh
            godot/tests/mocap_style.gd
            tools/mocap_style.py
