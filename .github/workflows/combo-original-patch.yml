name: Dynamic guard complete project verification
on:
  push:
    branches: [feature/lab-walk-control]
permissions:
  contents: read
  actions: read
jobs:
  project:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lab-Walk-Control-Windows-portable
          path: native
          run-id: 46016403387
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Overlay current project sources without rebuilding unchanged native modules
        shell: python
        run: |
          import shutil
          from pathlib import Path
          for p in ["godot/lab/walk_motion.gd","godot/lab/walk_studio.gd","godot/tests/walk_control.gd","godot/tests/lab_integration_100.gd","godot/project.godot"]:
              shutil.copy2(p,Path("native")/p)
      - name: Build and cold-test complete engine-free project ZIP
        run: python tools/package_dynamic_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: Lab-Dynamic-Guard-Project
          path: Lab-Dynamic-Guard-Project.zip
