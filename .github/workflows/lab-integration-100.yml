name: Lab 1.0 RC1 integration
on:
  push:
    branches: [feature/lab-1.0-integration]
    paths: ['godot/lab/hybrid_studio*', 'godot/lab/main.gd', 'godot/lab/hybrid091/**', 'godot/lab/impact_reactions_09*.gd', 'godot/tests/lab_integration_100.gd', '.github/workflows/lab-integration-100.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lab-godot
          key: lab-godot-linux-4.4.1
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: pip install scons numpy scipy pillow
      - name: Native oracle regression
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Build native body extension
        run: python native_cpp/build.py
      - name: Godot
        run: |
          mkdir -p ~/.cache/lab-godot
          if [ ! -x ~/.cache/lab-godot/godot ]; then
            curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
            unzip -qo /tmp/godot.zip -d ~/.cache/lab-godot
            mv ~/.cache/lab-godot/Godot_v4.4.1-stable_linux.x86_64 ~/.cache/lab-godot/godot
          fi
          echo "$HOME/.cache/lab-godot" >> "$GITHUB_PATH"
      - name: Verify frozen poses
        run: ~/.cache/lab-godot/godot --headless --path godot --script res://tests/body_fixture_verify.gd
      - name: Integration and replay
        run: |
          mkdir -p godot/.godot lab-integration-results
          echo res://addons/pixelfx/pixelfx.gdextension > godot/.godot/extension_list.cfg
          for script in lab/hybrid_studio.gd lab/main.gd tests/lab_integration_100.gd; do
            godot --headless --path godot --check-only --script "res://$script" 2>&1 | tee -a lab-integration-results/syntax.log
          done
          ! grep -E 'SCRIPT ERROR|Failed to load script' lab-integration-results/syntax.log
          python tools/hybrid_replay_091.py --godot godot --out lab-integration-results/replay
          timeout 120 xvfb-run -a godot --path godot --audio-driver Dummy --disable-vsync --rendering-method gl_compatibility --script res://tests/lab_integration_100.gd -- "$PWD/lab-integration-results" 2>&1 | tee lab-integration-results/engine.log
          grep LAB_100_INTEGRATION_OK lab-integration-results/engine.log
          ! grep -E 'SCRIPT ERROR|Failed to load script|ERROR:' lab-integration-results/engine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-integration-100
          path: lab-integration-results/
