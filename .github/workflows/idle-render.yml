name: Capture real Godot idle animation
on:
  push:
    branches: [audit/idle-render]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lab-Walk-Control-Windows-portable
          run-id: 46001744668
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native
      - name: Capture current T with native raster
        shell: pwsh
        run: |
          Copy-Item godot/tests/idle_capture.gd native/godot/tests/idle_capture.gd
          $frames = "$PWD/frames"
          Set-Location native
          cmd.exe /d /c START_LAB.bat --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & .\Godot_console.exe --headless --path godot --audio-driver Dummy --script res://tests/idle_capture.gd -- "$frames"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Assemble real raster frames at 1x and half speed
        run: |
          pip install pillow
          python tools/idle_gif.py
      - uses: actions/upload-artifact@v4
        with:
          name: idle-native-gifs
          path: preview/
