name: Optional C++ raster
on:
  push:
    branches: [main]
    paths:
      - 'native_cpp/**'
      - 'godot/addons/pixelfx/**'
      - 'godot/lab/**'
      - 'godot/tests/**'
      - 'tools/make_native_fixture.mjs'
      - '.github/workflows/cpp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: node tools/make_cpp_fixture.mjs
      - if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -O3 -ffp-contract=off -fno-fast-math native_cpp/test_kernel.cpp -o /tmp/pixelfx-kernel-test
          /tmp/pixelfx-kernel-test godot/tests/fixtures/cpp.bin
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /O2 /fp:strict /EHsc native_cpp/test_kernel.cpp /Fe:pixelfx-kernel-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\pixelfx-kernel-test.exe godot/tests/fixtures/cpp.bin
      - run: pip install scons
      - run: python native_cpp/build.py
      - run: node tools/make_native_fixture.mjs
      - run: node tools/make_painter_fixture.mjs
      - run: node tools/make_core_fixture.mjs
      - run: node tools/make_chain_fixture.mjs
      - run: node tools/make_particles_fixture.mjs
      - run: node tools/make_bits_fixture.mjs
      - run: node tools/make_ball_fixture.mjs
      - if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          $exe = Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter "*console.exe" | Select-Object -First 1
          if (-not $exe) { throw "Godot console executable missing" }
          Set-Content -Path (Join-Path $exe.DirectoryName "godot.cmd") -Value ('@"' + $exe.FullName + '" %*')
          $exe.DirectoryName >> $env:GITHUB_PATH
      - run: godot --headless --path godot --editor --import
      - run: godot --headless --path godot --script res://tests/native.gd
      - run: godot --headless --path godot --script res://tests/painter_full.gd
      - run: godot --headless --path godot --script res://tests/core.gd
      - run: godot --headless --path godot --script res://tests/native.gd -- --cpp
      - run: godot --headless --path godot --script res://tests/native_benchmark.gd
      - run: godot --headless --path godot --script res://tests/native_benchmark.gd -- --cpp
      - run: godot --headless --path godot --script res://tests/particles.gd -- --cpp
      - run: godot --headless --path godot --script res://tests/bits.gd -- --cpp
      - run: godot --headless --path godot --script res://tests/ball.gd
      - run: godot --headless --path godot --script res://tests/ball.gd -- --cpp
      - run: godot --headless --path godot --script res://tests/chain.gd -- --cpp
      - run: godot --headless --path godot res://lab/chain_lightning.tscn --quit-after 120
      - run: godot --headless --path godot --script res://tests/custom.gd -- --cpp
      - run: godot --headless --path godot res://lab/custom_effects.tscn --quit-after 120
      - run: godot --headless --path godot --script res://tests/native_benchmark.gd -- --cpp --batch
      - run: godot --headless --path godot --script res://tests/cpp_stress.gd -- --cpp
      - uses: actions/upload-artifact@v4
        with:
          name: custom-preview-${{ runner.os }}
          path: reports/rift-collapse-cpp.png
      - uses: actions/upload-artifact@v4
        with:
          name: pixelfx-cpp-${{ runner.os }}
          path: |
            godot/addons/pixelfx/bin/
            godot/addons/pixelfx/pixelfx.gdextension

  package:
    needs: cpp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: pixelfx-cpp-*
          path: /tmp/pixelfx-binaries
      - run: npm run bootstrap
      - run: node tools/check_exports.mjs
      - run: node tools/make_native_fixture.mjs
      - run: node tools/make_painter_fixture.mjs
      - run: node tools/make_core_fixture.mjs
      - run: node tools/make_chain_fixture.mjs
      - run: node tools/make_particles_fixture.mjs
      - run: node tools/make_bits_fixture.mjs
      - run: node tools/make_ball_fixture.mjs
      - run: node tools/package.mjs
      - run: node tools/bundle_accelerators.mjs /tmp/pixelfx-binaries "$GITHUB_RUN_ID"
      - name: Validate bundled project
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          PROJECT=dist/PixelFX-Godot-Toolkit/godot
          "$GODOT" --headless --path "$PROJECT" --editor --import
          "$GODOT" --headless --path "$PROJECT" --script res://tests/native.gd -- --cpp
          "$GODOT" --headless --path "$PROJECT" --script res://tests/painter_full.gd
          "$GODOT" --headless --path "$PROJECT" --script res://tests/core.gd
          "$GODOT" --headless --path "$PROJECT" --script res://tests/ball.gd -- --cpp
          "$GODOT" --headless --path "$PROJECT" --script res://tests/chain.gd -- --cpp
          "$GODOT" --headless --path "$PROJECT" --script res://tests/custom.gd -- --cpp
          "$GODOT" --headless --path "$PROJECT" res://lab/custom_effects.tscn --quit-after 120
          "$GODOT" --headless --path "$PROJECT" --script res://tests/smoke.gd
          "$GODOT" --headless --path "$PROJECT" res://lab/live_lightning.tscn --quit-after 120 -- --demo-native
          rm -rf "$PROJECT/.godot"
          find "$PROJECT" -name '*.import' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: PixelFX-Godot-Toolkit-Complete
          path: dist/PixelFX-Godot-Toolkit/
          if-no-files-found: error
