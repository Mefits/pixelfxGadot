name: Optional C++ raster
on:
  push:
    branches: [main]
    paths:
      - 'native_cpp/**'
      - 'godot/addons/pixelfx/native/**'
      - 'godot/tests/**'
      - 'tools/make_native_fixture.mjs'
      - '.github/workflows/cpp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: pip install scons
      - run: python native_cpp/build.py
      - run: node tools/make_native_fixture.mjs
      - if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          $exe = Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter "*console.exe" | Select-Object -First 1
          Copy-Item $exe.FullName (Join-Path $exe.DirectoryName "godot.exe")
          $exe.DirectoryName >> $env:GITHUB_PATH
      - run: godot --headless --path godot --editor --import
      - run: godot --headless --path godot --script res://tests/native.gd
      - run: godot --headless --path godot --script res://tests/native.gd -- --cpp
      - run: godot --headless --path godot --script res://tests/native_benchmark.gd
      - run: godot --headless --path godot --script res://tests/native_benchmark.gd -- --cpp
      - uses: actions/upload-artifact@v4
        with:
          name: pixelfx-cpp-${{ runner.os }}
          path: |
            godot/addons/pixelfx/bin/
            godot/addons/pixelfx/pixelfx.gdextension
