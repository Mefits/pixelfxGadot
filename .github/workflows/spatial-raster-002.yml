name: Spatial Lab native raster 002
on:
  push:
    branches: [experiment/spatial-lab-night]
    paths:
      - 'godot/lab/spatial_lab/**'
      - 'godot/tests/spatial_raster_002.gd'
      - '.github/workflows/spatial-raster-002.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: pip install scons
      - name: Existing native raster oracle
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Build existing PixelFX extension
        run: python native_cpp/build.py
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o engine.zip
          unzip -q engine.zip -d engine
          chmod +x engine/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p godot/.godot
          echo res://addons/pixelfx/pixelfx.gdextension > godot/.godot/extension_list.cfg
      - name: Native Godot render and spatial gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raster-results
          timeout 120s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/spatial_raster_002.gd -- "$PWD/raster-results" 2>&1 | tee raster-results/engine.log
          ! grep -E 'SCRIPT ERROR|ERROR:' raster-results/engine.log
          grep SPATIAL_RASTER_002 raster-results/engine.log
          test -s raster-results/pose-0-yaw-090.png
          test -s raster-results/pose-2-yaw-270.png
          test -s raster-results/end-on.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-raster-002
          path: raster-results/
