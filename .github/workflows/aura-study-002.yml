name: Aura Lab 002 native hand comparison
on:
  push:
    branches: [experiment/aura-lab-002]
    paths:
      - 'godot/lab/aura_study_002/**'
      - 'native_cpp/aura*'
      - 'native_cpp/extension.cpp'
      - 'native_cpp/body_tests/aura002.cpp'
      - 'godot/tests/aura_study_002.gd'
      - 'tools/aura_study_002_media.py'
      - '.github/workflows/aura-study-002.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: |
          pip install scons pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Existing native raster oracle
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Native aura fixture
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/aura002.cpp -o /tmp/aura-test
          /tmp/aura-test
      - name: Build existing PixelFX extension
        run: python native_cpp/build.py
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o engine.zip
          unzip -q engine.zip -d engine
          chmod +x engine/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p godot/.godot
          echo res://addons/pixelfx/pixelfx.gdextension > godot/.godot/extension_list.cfg
      - name: Real Godot aura comparison and state isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aura-results
          timeout 300s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/aura_study_002.gd -- "$PWD/aura-results" 2>&1 | tee aura-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' aura-results/engine.log; then exit 1; fi
          grep AURA_STUDY_002 aura-results/engine.log
          test -s aura-results/metrics.json
      - name: Native capture media encoding
        run: python tools/aura_study_002_media.py aura-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-study-002
          path: aura-results/
