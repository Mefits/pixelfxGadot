name: Combat Lab 007 abstract arena
on:
  push:
    branches: [experiment/combat-lab-007]
    paths:
      - 'godot/lab/combat_study_007/**'
      - 'godot/lab/combat_study_001/world.gd'
      - 'godot/lab/hybrid091/kernel.gd'
      - 'godot/tests/combat_study_007.gd'
      - 'tools/combat_study_007_media.py'
      - '.github/workflows/combat-study-007.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: |
          pip install scons pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Existing native raster oracle
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Build existing PixelFX extension
        run: python native_cpp/build.py
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o engine.zip
          unzip -q engine.zip -d engine
          chmod +x engine/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p godot/.godot
          echo res://addons/pixelfx/pixelfx.gdextension > godot/.godot/extension_list.cfg
      - name: Verified 006 baseline regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline-results
          timeout 180s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/combat_study_006.gd -- "$PWD/baseline-results" 2>&1 | tee baseline-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' baseline-results/engine.log; then exit 1; fi
          grep COMBAT_STUDY_006 baseline-results/engine.log
      - name: Godot abstract view and exact baseline parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p l-results
          timeout 240s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/combat_study_007.gd -- "$PWD/l-results" 2>&1 | tee l-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' l-results/engine.log; then exit 1; fi
          grep COMBAT_STUDY_007 l-results/engine.log
          test -s l-results/spacing-0028.png
          test -s l-results/duel_02-0040.png
          test -s l-results/metrics.json
      - name: Interactive scene smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s "$GODOT" --headless --path godot --audio-driver Dummy res://lab/combat_study_007/scene.tscn --quit-after 30 2>&1 | tee l-results/scene.log
          if grep -E 'SCRIPT ERROR|ERROR:' l-results/scene.log; then exit 1; fi
      - name: Verified mobile comparisons
        run: python tools/combat_study_007_media.py l-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-study-007
          path: |
            l-results/
            baseline-results/engine.log
