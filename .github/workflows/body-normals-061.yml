name: Lab joint normals 061
on:
  push:
    branches: [experiment/body-anatomy-059]
    paths:
      - 'native_cpp/body_raster.hpp'
      - 'native_cpp/body_extension.hpp'
      - 'native_cpp/body_loft.hpp'
      - 'godot/tests/body_union_062.gd'
      - 'tools/body_union_062.py'
      - 'native_cpp/body_tests/loft.cpp'
      - 'godot/tests/body_normals_061.gd'
      - 'tools/body_normals_061.py'
      - '.github/workflows/body-normals-061.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lab-godot
          key: lab-godot-linux-4.4.1
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: pip install scons numpy scipy pillow
      - name: Native oracle regression
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Build native body extension
        run: python native_cpp/build.py
      - name: Godot
        run: |
          mkdir -p ~/.cache/lab-godot
          if [ ! -x ~/.cache/lab-godot/godot ]; then
            curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
            unzip -qo /tmp/godot.zip -d ~/.cache/lab-godot
            mv ~/.cache/lab-godot/Godot_v4.4.1-stable_linux.x86_64 ~/.cache/lab-godot/godot
          fi
          echo "$HOME/.cache/lab-godot" >> "$GITHUB_PATH"
      - name: Verify frozen poses
        run: ~/.cache/lab-godot/godot --headless --path godot --script res://tests/body_fixture_verify.gd
      - name: Native capture
        run: |
          mkdir -p godot/.godot
          echo res://addons/pixelfx/pixelfx.gdextension > godot/.godot/extension_list.cfg
          python tools/body_normals_061.py --godot godot --out body-skin-results
      - name: Lab 062 geometric capture
        run: python tools/body_union_062.py --godot godot --out body-union-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-normals-061
          path: |
            body-skin-results/*.gif
            body-skin-results/metrics.json
            body-skin-results/review.png
            body-skin-results/stand-review.png
            body-skin-results/engine.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-union-062
          path: |
            body-union-results/*.gif
            body-union-results/metrics.json
            body-union-results/review.png
            body-union-results/stand-review.png
            body-union-results/pelvis-review.png
            body-union-results/engine.log
