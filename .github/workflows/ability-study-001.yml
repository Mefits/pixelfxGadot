name: Ability Lab 001 composition
on:
  push:
    branches: [experiment/ability-lab-001]
    paths:
      - 'godot/lab/ability_study_001/**'
      - 'godot/lab/combat_study_001/world.gd'
      - 'godot/tests/ability_study_001.gd'
      - 'tools/ability_study_001_media.py'
      - '.github/workflows/ability-study-001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: native_cpp/godot-cpp
          key: body-skin-godot-cpp-e4b7c25-linux
      - run: |
          pip install scons pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Existing native raster oracle
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math native_cpp/body_tests/test.cpp -o /tmp/body-test
          /tmp/body-test native_cpp/body_tests/oracle.txt
          g++ -std=c++17 -O2 -ffp-contract=off native_cpp/body_tests/loft.cpp -o /tmp/loft-test
          /tmp/loft-test
      - name: Build existing PixelFX extension
        run: python native_cpp/build.py
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o engine.zip
          unzip -q engine.zip -d engine
          chmod +x engine/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT=$PWD/engine/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p godot/.godot
          echo res://addons/pixelfx/pixelfx.gdextension > godot/.godot/extension_list.cfg
      - name: Original 001 duel regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p regression-results
          timeout 120s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/combat_study_001.gd -- "$PWD/regression-results" 2>&1 | tee regression-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' regression-results/engine.log; then exit 1; fi
          grep COMBAT_STUDY_001 regression-results/engine.log
          mkdir -p combo-results
          timeout 120s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/combat_study_002.gd -- "$PWD/combo-results" 2>&1 | tee combo-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' combo-results/engine.log; then exit 1; fi
          grep COMBAT_STUDY_002 combo-results/engine.log
          mkdir -p ability-results
          timeout 120s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/combat_study_003.gd -- "$PWD/ability-results" 2>&1 | tee ability-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' ability-results/engine.log; then exit 1; fi
          grep COMBAT_STUDY_003 ability-results/engine.log
          mkdir -p air-results
          timeout 120s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/combat_study_004.gd -- "$PWD/air-results" 2>&1 | tee air-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' air-results/engine.log; then exit 1; fi
          grep COMBAT_STUDY_004 air-results/engine.log
      - name: Native Godot defense and active opponent gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p l-results
          timeout 120s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/combat_study_005.gd -- "$PWD/l-results" 2>&1 | tee l-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' l-results/engine.log; then exit 1; fi
          grep COMBAT_STUDY_005 l-results/engine.log
          test -s l-results/parry-028.png
          test -s l-results/air_escape-040.png
          test -s l-results/metrics.json
      - name: Native Godot ability composition gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ability001-results
          timeout 300s "$GODOT" --headless --path godot --audio-driver Dummy --script res://tests/ability_study_001.gd -- "$PWD/ability001-results" 2>&1 | tee ability001-results/engine.log
          if grep -E 'SCRIPT ERROR|ERROR:' ability001-results/engine.log; then exit 1; fi
          grep ABILITY_STUDY_001 ability001-results/engine.log
          test -s ability001-results/metrics.json
      - name: Native capture media encoding
        run: python tools/ability_study_001_media.py ability001-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ability-study-001
          path: |
            ability001-results/
            l-results/engine.log
            regression-results/engine.log
            combo-results/engine.log
            ability-results/engine.log
            air-results/engine.log
